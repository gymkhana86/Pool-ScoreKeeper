  for(let i=0;i<state.playerCount;i++){
   const option=document.createElement('option');option.value=String(i);option.textContent=nameOf(i);select.append(option);
  }
  select.value=String(state.active[slot]);label.append(select);fields.append(label);selects.push(select);
 }
 const error=document.createElement('p');error.className='first-game-error';error.setAttribute('role','alert');
 const actions=document.createElement('div');actions.className='first-game-actions';
 const confirm=document.createElement('button');confirm.type='button';confirm.className='next-choice';confirm.textContent='Start Game';
 confirm.addEventListener('click',()=>{
  const chosen=selects.map(select=>Number(select.value));
  if(chosen[0]===chosen[1]){error.textContent='Please select two different players.';return}
  state.active=chosen;
  normalizeQueue();clearTeams();save();closeNextPlayerDialog();render();
  message(nameOf(chosen[0])+' vs. '+nameOf(chosen[1])+'. Ready to play!');
 });
 const cancel=document.createElement('button');cancel.type='button';cancel.className='next-keep';cancel.textContent='Cancel';
 cancel.addEventListener('click',closeNextPlayerDialog);
 actions.append(confirm,cancel);dialog.append(heading,description,fields,error,actions);overlay.append(dialog);
 document.body.append(overlay);nextPlayerDialog=overlay;selects[0].focus();
}
el('chooseFirst').addEventListener('click',chooseFirstGame);

function closeNextPlayerDialog(){if(nextPlayerDialog){nextPlayerDialog.remove();nextPlayerDialog=null}}
function askNextPlayer(winner){
 closeNextPlayerDialog();normalizeQueue();
 if(!state.waitingQueue.length)return;
 const loserSlot=state.active.findIndex(j=>j!==winner);
 const loser=state.active[loserSlot];
 const overlay=document.createElement('div');overlay.className='next-overlay';
 const dialog=document.createElement('section');dialog.className='next-dialog';
 dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-labelledby','next-title');
 const heading=document.createElement('h2');heading.id='next-title';heading.textContent='Who plays next?';
 const desc=document.createElement('p');desc.textContent=nameOf(winner)+' stays at the table. Select who replaces '+nameOf(loser)+'.';
 const choices=document.createElement('div');choices.className='next-choices';
 for(const player of state.waitingQueue){
  const button=document.createElement('button');button.type='button';button.textContent=nameOf(player);button.className='next-choice';
  button.addEventListener('click',()=>{
   if(!state.waitingQueue.includes(player)){closeNextPlayerDialog();return}
   state.active[loserSlot]=player;
   state.waitingQueue=state.waitingQueue.filter(j=>j!==player);
   state.waitingQueue.push(loser);
   normalizeQueue();clearTeams();save();closeNextPlayerDialog();render();
   message(nameOf(winner)+' stays. '+nameOf(player)+' replaces '+nameOf(loser)+'.');
  });choices.append(button);
 }
 const keep=document.createElement('button');keep.type='button';keep.className='next-keep';keep.textContent='Keep current players';
 keep.addEventListener('click',()=>{closeNextPlayerDialog();message('Win recorded. Current players remain at the table.')});
 dialog.append(heading,desc,choices,keep);overlay.append(dialog);document.body.append(overlay);nextPlayerDialog=overlay;
 choices.querySelector('button')?.focus();
}
function award(i,reason='normal'){
 if(!state.active.includes(i))return;
 closeNextPlayerDialog();normalizeQueue();
 state.history.push({winner:i,reason,teams:[...state.teams],active:[...state.active],waitingQueue:[...state.waitingQueue]});
 if(reason==='default')state.defaultWins[i]++;else state.scores[i]++;
 clearTeams();save();render();
 message(nameOf(i)+(reason==='default'?' won by default.':' won the game.')+' Ball assignments cleared.');
 askNextPlayer(i);
}
function undo(){
 closeNextPlayerDialog();
 if(!state.history.length){message('No wins to undo');return}
 const entry=state.history.pop();const i=typeof entry==='number'?entry:entry.winner;
 if(!Number.isInteger(i)||i<0||i>=6){message('Unable to undo this entry');return}
 if(entry&&typeof entry==='object'&&entry.reason==='default')state.defaultWins[i]=Math.max(0,state.defaultWins[i]-1);
 else state.scores[i]=Math.max(0,state.scores[i]-1);
 if(entry&&typeof entry==='object'&&Array.isArray(entry.active)&&entry.active.length===2&&entry.active.every(j=>Number.isInteger(j)&&j>=0&&j<state.playerCount)&&entry.active[0]!==entry.active[1])state.active=[...entry.active];
 if(entry&&typeof entry==='object'&&Array.isArray(entry.waitingQueue))state.waitingQueue=[...entry.waitingQueue];
 state.teams=entry&&typeof entry==='object'&&Array.isArray(entry.teams)?Array.from({length:6},(_,j)=>entry.teams[j]??null):Array(6).fill(null);
 normalizeQueue();save();render();message('Last win undone; previous players, waiting order, and ball assignments restored.');
}
function resetMatch(){
 closeNextPlayerDialog();
 if(!confirm('Reset all regular wins, default wins, and ball assignments for all players? Names and player count will be kept.'))return;
 state.scores=Array(6).fill(0);state.defaultWins=Array(6).fill(0);clearTeams();state.history=[];
 save();render();message('New match ready');
}
el('playerCount').addEventListener('change',e=>{
 closeNextPlayerDialog();
 state.playerCount=Number(e.target.value);
 if(state.active.some(i=>i>=state.playerCount)||state.active[0]===state.active[1])state.active=[0,1];
 normalizeQueue();clearTeams();save();render();message('Showing '+state.playerCount+' players. All scores preserved.');
});
render();
function shade(hex,factor){const n=parseInt(hex.slice(1),16);const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v*factor));return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
function setTheme(hex){if(!/^#[0-9a-fA-F]{6}$/.test(hex))return;document.documentElement.style.setProperty('--felt-light',hex);document.documentElement.style.setProperty('--felt-dark',shade(hex,.24));document.documentElement.style.setProperty('--panel',shade(hex,.56));document.documentElement.style.setProperty('--panel-border',shade(hex,1.15));document.documentElement.style.setProperty('--field',shade(hex,.34));document.querySelector('meta[name="theme-color"]').content=shade(hex,.24);el('customColor').value=hex;document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color.toLowerCase()===hex.toLowerCase())));try{localStorage.setItem(THEME_KEY,hex)}catch{}}
document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.color)));el('customColor').addEventListener('input',e=>setTheme(e.target.value));let savedTheme='#245c43';try{savedTheme=localStorage.getItem(THEME_KEY)||savedTheme}catch{}setTheme(savedTheme);
if(location.protocol!=='file:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
