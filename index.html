<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b24"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Pool Scorekeeper</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f6f8f5;background:#0b1c17}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,var(--felt-light,#214d3c),var(--felt-dark,#0b1c17) 70%)}main{max-width:850px;margin:auto;padding:22px 16px 60px}header{text-align:center;margin-bottom:25px}h1{font-size:clamp(27px,5vw,42px);margin:6px 0}header p{color:#bed3c8;margin:0}.board{display:grid;grid-template-columns:1fr 1fr;gap:15px}.player{background:var(--panel,#163b30);border:1px solid var(--panel-border,#3b6b56);border-radius:22px;padding:19px;display:flex;flex-direction:column;gap:16px;min-width:0}.player input{width:100%;border:1px solid #608474;background:var(--field,#0c281f);color:white;border-radius:11px;font:700 clamp(17px,3vw,25px) system-ui;padding:12px;text-align:center}.score{font-size:clamp(80px,17vw,150px);font-weight:850;line-height:1;text-align:center;font-variant-numeric:tabular-nums}.hint{text-align:center;color:#b9d2c3;font-size:13px;text-transform:uppercase;letter-spacing:2px}.team{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #f2c75a;outline-offset:2px}.team button{border:2px solid #6a8a7c;background:var(--field,#0b2a21);color:#f6f8f5;border-radius:12px;min-height:54px;font-weight:750}.team button.selected{border-color:#f5cb57;background:#395036}.ball{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;width:23px;height:23px;background:#f1c741;color:#151515;font-size:12px;margin-right:5px}.ball.stripe{background:linear-gradient(#fff 0 27%,#e4aa22 27% 73%,#fff 73%);color:#222}.win{background:#e4b94e;color:#19291e;border:0;border-radius:14px;min-height:65px;font-size:19px;font-weight:850}.win:active{transform:scale(.98)}.default-win{background:#25372e;color:#f5e8cc;border:2px solid #c9a96b;border-radius:12px;min-height:46px;font-size:14px;font-weight:750}.default-win:active{transform:scale(.98)}.tools{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.tools button{border:1px solid #638575;border-radius:12px;background:var(--panel,#214637);color:white;padding:12px 20px;font-weight:650}.tools .danger{border-color:#a5746e;color:#ffd2c9}.message{text-align:center;color:#b9d2c3;min-height:25px;margin-top:15px}footer{text-align:center;color:#9db8a8;font-size:13px;margin-top:35px}@media(max-width:560px){main{padding:15px 10px 45px}.board{gap:9px}.player{padding:12px 9px;border-radius:15px;gap:13px}.team{grid-template-columns:1fr}.team button{min-height:44px}.win{min-height:62px;font-size:16px}.player input{padding:9px 5px}}
.appearance{margin:26px auto 0;max-width:680px;border:1px solid #78908270;border-radius:18px;padding:16px;background:#0b1518a8}.appearance h2{font-size:17px;margin:0 0 6px;text-align:center}.appearance p{margin:0 0 14px;color:#c7d4cc;text-align:center;font-size:13px}.swatches{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.swatch{width:46px;height:46px;border-radius:50%;border:3px solid #ffffff66;background:var(--swatch);position:relative}.swatch[aria-pressed="true"]{outline:3px solid #f5cb57;outline-offset:3px}.custom-color{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:17px;font-size:14px}.custom-color input{width:55px;height:42px;border:0;background:transparent;cursor:pointer}.appearance button:focus-visible,.appearance input:focus-visible{outline:3px solid #f5cb57;outline-offset:3px}

/* Pool table surround: six true pocket locations, wood rails and selectable felt. */
main{max-width:1000px;padding-top:20px}
.pool-table{padding:15px;background:linear-gradient(135deg,#9d673b 0%,#422718 16%,#986036 45%,#392316 78%,#a26a3f 100%);border:3px solid #26160e;border-radius:35px;box-shadow:0 14px 35px #0009,inset 0 0 0 3px #c08a54,inset 0 0 0 7px #3b2619}
.table-surface{position:relative;border:13px solid #32291e;border-radius:23px;min-height:510px;background:radial-gradient(ellipse at 50% 40%,var(--felt-light,#245c43),var(--felt-dark,#102b20) 145%);box-shadow:inset 0 0 0 3px #92734b,inset 0 0 32px #0008;isolation:isolate}
.table-surface:before{content:"";position:absolute;inset:12px;border:2px solid #ffffff1c;border-radius:7px;pointer-events:none}
.pocket{position:absolute;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 48% 48%,#020303 0 56%,#15100d 68%,#a4774d 72%,#26160e 84%);box-shadow:inset 0 3px 7px #000,0 1px 3px #0009;z-index:2;pointer-events:none}
.pocket.tl{left:-25px;top:-25px}.pocket.tr{right:-25px;top:-25px}.pocket.bl{left:-25px;bottom:-25px}.pocket.br{right:-25px;bottom:-25px}.pocket.tm{left:50%;top:-27px;transform:translateX(-50%)}.pocket.bm{left:50%;bottom:-27px;transform:translateX(-50%)}
.table-content{position:relative;z-index:1;padding:36px 27px 28px}
.table-content header p,.table-content .message{color:#f3f7f1}
.player{background:color-mix(in srgb,var(--panel,#163b30) 88%,black);box-shadow:0 8px 22px #0005;backdrop-filter:blur(5px)}
.table-content .tools{margin-top:22px}
@media(max-width:560px){main{padding:12px 7px 40px}.pool-table{padding:9px;border-radius:25px}.table-surface{border-width:9px;border-radius:17px;min-height:480px}.table-content{padding:33px 8px 20px}.pocket{width:39px;height:39px}.pocket.tl{left:-19px;top:-19px}.pocket.tr{right:-19px;top:-19px}.pocket.bl{left:-19px;bottom:-19px}.pocket.br{right:-19px;bottom:-19px}.pocket.tm{top:-20px}.pocket.bm{bottom:-20px}}
.default-count{color:#f2cd79;font-weight:800;letter-spacing:0.5px;white-space:nowrap}</style></head><body><main><div class="pool-table" aria-label="Pool table with six pockets"><div class="table-surface"><span class="pocket tl"></span><span class="pocket tm"></span><span class="pocket tr"></span><span class="pocket bl"></span><span class="pocket bm"></span><span class="pocket br"></span><div class="table-content"><header><h1>🎱 Pool Scorekeeper</h1><p>Two players. One table. Keep the score.</p></header><section class="board" aria-label="Scoreboard"><article class="player"><input id="name0" aria-label="Player 1 name" maxlength="30" value="Player 1"><div class="hint">Games Won <span class="default-count" id="defaults0">(0)</span></div><div id="score0" class="score" aria-live="polite">0</div><div class="team"><button id="solid0" onclick="assign(0,'solids')"><span class="ball">1</span>Solids</button><button id="stripe0" onclick="assign(0,'stripes')"><span class="ball stripe">9</span>Stripes</button></div><button class="win" onclick="award(0)">+ Win Game</button><button class="default-win" onclick="award(0,'default')">Won by Default</button></article><article class="player"><input id="name1" aria-label="Player 2 name" maxlength="30" value="Player 2"><div class="hint">Games Won <span class="default-count" id="defaults1">(0)</span></div><div id="score1" class="score" aria-live="polite">0</div><div class="team"><button id="solid1" onclick="assign(1,'solids')"><span class="ball">1</span>Solids</button><button id="stripe1" onclick="assign(1,'stripes')"><span class="ball stripe">9</span>Stripes</button></div><button class="win" onclick="award(1)">+ Win Game</button><button class="default-win" onclick="award(1,'default')">Won by Default</button></article></section><div class="tools"><button onclick="undo()">↶ Undo Last Win</button><button class="danger" onclick="resetMatch()">Reset Match</button></div><div id="message" class="message" role="status"></div></div></div></div><section class="appearance" aria-label="Background color settings"><h2>Table Color</h2><p>Choose your preferred pool table felt color</p><div class="swatches" id="swatches"><button class="swatch" style="--swatch:#245c43" data-color="#245c43" aria-label="Green felt" title="Green felt"></button><button class="swatch" style="--swatch:#245b91" data-color="#245b91" aria-label="Blue felt" title="Blue felt"></button><button class="swatch" style="--swatch:#762e35" data-color="#762e35" aria-label="Red felt" title="Red felt"></button><button class="swatch" style="--swatch:#573c83" data-color="#573c83" aria-label="Purple felt" title="Purple felt"></button><button class="swatch" style="--swatch:#363b43" data-color="#363b43" aria-label="Charcoal felt" title="Charcoal felt"></button></div><label class="custom-color" for="customColor">Custom color <input type="color" id="customColor" value="#245c43" aria-label="Choose custom background color"></label></section><footer>Saved automatically on this device • 8-ball match scoring</footer></main><script>
const KEY='pool-scorekeeper-v1';const THEME_KEY='pool-scorekeeper-theme-v2';const defaults=()=>({names:['Player 1','Player 2'],scores:[0,0],defaultWins:[0,0],teams:[null,null],history:[]});let state=defaults();try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Array.isArray(old.names)&&Array.isArray(old.scores)&&Array.isArray(old.teams)&&Array.isArray(old.history))state=old}catch{}// v5 stored all wins in scores. Separate default wins using the recorded history.
if(!Array.isArray(state.defaultWins)){state.defaultWins=[0,0];for(const entry of state.history){if(entry&&typeof entry==='object'&&entry.reason==='default'&&(entry.winner===0||entry.winner===1)){state.defaultWins[entry.winner]++;}}for(let i=0;i<2;i++)state.scores[i]=Math.max(0,(Number(state.scores[i])||0)-state.defaultWins[i]);}
const el=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function message(s){el('message').textContent=s}function render(){for(let i=0;i<2;i++){el('name'+i).value=state.names[i];el('score'+i).textContent=state.scores[i];el('defaults'+i).textContent='('+state.defaultWins[i]+')';for(const t of ['solids','stripes']){const b=el((t==='solids'?'solid':'stripe')+i);b.classList.toggle('selected',state.teams[i]===t);b.setAttribute('aria-pressed',String(state.teams[i]===t))}}}function assign(i,t){if(state.teams[i]===t){state.teams=[null,null];message('Ball assignments cleared')}else{state.teams[i]=t;state.teams[1-i]=t==='solids'?'stripes':'solids';message(`${state.names[i]||'Player '+(i+1)}: ${t}`)}save();render()}function award(i,reason='normal'){state.history.push({winner:i,reason,teams:[...state.teams]});if(reason==='default')state.defaultWins[i]++;else state.scores[i]++;state.teams=[null,null];save();render();message(reason==='default'?`${state.names[i]||'Player '+(i+1)} won by default. Ball assignments cleared for the next game.`:`Game awarded to ${state.names[i]||'Player '+(i+1)}. Choose Solids or Stripes for the next game.`)}function undo(){if(!state.history.length){message('No wins to undo');return}const entry=state.history.pop();const i=typeof entry==='number'?entry:entry.winner;if(entry&&typeof entry==='object'&&entry.reason==='default')state.defaultWins[i]=Math.max(0,state.defaultWins[i]-1);else state.scores[i]=Math.max(0,state.scores[i]-1);if(typeof entry==='object'&&Array.isArray(entry.teams))state.teams=entry.teams;save();render();message('Last win undone; previous ball assignments restored when available')}function resetMatch(){if(!confirm('Reset regular wins, default wins, and ball assignments? Player names will be kept.'))return;state.scores=[0,0];state.defaultWins=[0,0];state.teams=[null,null];state.history=[];save();render();message('New match ready')}for(let i=0;i<2;i++)el('name'+i).addEventListener('input',e=>{state.names[i]=e.target.value;save()});render();
function shade(hex,factor){const n=parseInt(hex.slice(1),16);const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v*factor));return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
function setTheme(hex){if(!/^#[0-9a-fA-F]{6}$/.test(hex))return;document.documentElement.style.setProperty('--felt-light',hex);document.documentElement.style.setProperty('--felt-dark',shade(hex,.24));document.documentElement.style.setProperty('--panel',shade(hex,.56));document.documentElement.style.setProperty('--panel-border',shade(hex,1.15));document.documentElement.style.setProperty('--field',shade(hex,.34));document.querySelector('meta[name="theme-color"]').content=shade(hex,.24);el('customColor').value=hex;document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color.toLowerCase()===hex.toLowerCase())));try{localStorage.setItem(THEME_KEY,hex)}catch{}}
document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.color)));el('customColor').addEventListener('input',e=>setTheme(e.target.value));let savedTheme='#245c43';try{savedTheme=localStorage.getItem(THEME_KEY)||savedTheme}catch{}setTheme(savedTheme);
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
